spring:
  application:
    name: barberbook
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/barberbook}
    username: ${DATABASE_USER:barberbook}
    password: ${DATABASE_PASSWORD:barberbook}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema, Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  # E-mail: set SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
  # and MAIL_FROM as environment variables. Without SPRING_MAIL_HOST nothing is sent (log only).
  mail:
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework   # behind nginx / a hosting proxy

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false   # don't connect to the SMTP server on every health check

app:
  booking:
    slot-step-minutes: 15
    min-lead-time: 30m
    max-days-ahead: 60
    cancel-cutoff: 2h
    reminder-before: 24h
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    shop-slug: ${ADMIN_SHOP_SLUG:mr-artist}
  mail:
    from: ${MAIL_FROM:}             # sender address, must be verified at the mail provider
    reply-to: ${MAIL_REPLY_TO:}     # e.g. the shop's own address, so replies reach the barber
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
