spring:
  application:
    name: barberbook
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/barberbook}
    username: ${DATABASE_USER:barberbook}
    password: ${DATABASE_PASSWORD:barberbook}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema, Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework   # behind nginx / a hosting proxy

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  booking:
    slot-step-minutes: 15
    min-lead-time: 30m
    max-days-ahead: 60
    cancel-cutoff: 2h
    reminder-before: 24h
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    shop-slug: ${ADMIN_SHOP_SLUG:mr-artist}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
