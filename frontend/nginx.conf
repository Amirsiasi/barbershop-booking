server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API -> Spring Boot (same origin, so no CORS needed)
    location /api/ {
        proxy_pass http://backend:8080;
        # Spring must see the same host AND port the browser sent in its Origin header,
        # otherwise it treats our own POSTs as cross-origin and answers 403.
        # X-Forwarded-Proto makes Spring reset the port, so X-Forwarded-Host must
        # carry it again ($http_host = "localhost:5173", $host would drop the port).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # long cache for hashed build files
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # single page app: /termin/abc and /admin are handled by React Router
    location / {
        try_files $uri /index.html;
    }
}
