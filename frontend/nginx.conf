server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API -> Spring Boot (same origin, so no CORS needed)
    location /api/ {
        proxy_pass http://backend:8080;
        # $http_host keeps the port, so Host matches the browser's Origin header
        # and Spring does not treat same-site POSTs as cross-origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # long cache for hashed build files
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # single page app: /termin/abc and /admin are handled by React Router
    location / {
        try_files $uri /index.html;
    }
}
