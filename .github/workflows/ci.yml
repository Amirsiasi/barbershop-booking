name: CI

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch cancels the older, still running build
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 17, PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Unit tests + integration tests against a real PostgreSQL
      # (Docker is available on GitHub runners, so Testcontainers starts it automatically)
      - name: Build and test
        run: mvn -B -ntp verify

      # turns every failed test into an error annotation on the GitHub run page
      - name: Show failed tests
        if: failure()
        shell: python3 {0}
        run: |
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('target/surefire-reports/TEST-*.xml'):  # runs inside backend/
              for case in ET.parse(f).getroot().iter('testcase'):
                  for kind in ('failure', 'error'):
                      e = case.find(kind)
                      if e is not None:
                          msg = (e.get('message') or e.text or '').replace('\n', ' ').replace('%', '%25')[:900]
                          name = case.get('classname').split('.')[-1] + '.' + case.get('name')
                          print(f'::error title={name}::{msg}')

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # make sure both Dockerfiles still build, so "docker compose up" keeps working
      - name: Build images
        env:
          ADMIN_PASSWORD: ci-only
        run: docker compose build
